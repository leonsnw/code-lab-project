services:
  postgres:
    image: postgres:16-alpine
    container_name: codelab-postgres
    environment:
      POSTGRES_USER: codelab
      POSTGRES_PASSWORD: codelab
      POSTGRES_DB: codelab
    ports:
      - "5432:5432"
    volumes:
      - codelab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelab -d codelab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codelab_postgres_data:
